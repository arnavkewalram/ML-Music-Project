[pytest]
testpaths = tests
# Make the repo root importable so `from webapp import ...` resolves however
# pytest is invoked. `python -m pytest` adds the CWD to sys.path implicitly and
# the bare `pytest` console script does not, which passed locally and failed in
# CI with ModuleNotFoundError.
pythonpath = .
markers =
    slow: loads pretrained models or runs the full chain (opt in with `pytest -m slow`)
# Default to the fast suite. `pytest -m slow` overrides this and runs only the
# slow tests; `pytest -m ""` runs everything.
addopts = -m "not slow" --strict-markers -q
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
