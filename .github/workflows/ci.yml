name: CI

on:
  push:
    branches: [main, autotune]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: fast tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install system audio libraries
        run: sudo apt-get update && sudo apt-get install -y libsndfile1 ffmpeg

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-test.txt

      - name: Run the fast suite
        # The `slow` tests are excluded by pytest.ini; they need ~2GB of
        # pretrained models and belong in a nightly job, not on every push.
        run: pytest --cov=webapp --cov-report=term-missing
